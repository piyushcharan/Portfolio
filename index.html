  <!-- React 18 & ReactDOM 18 & Babel for seamless single-page execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body class="bg-[#060d1a] text-slate-100 font-sans antialiased transition-colors duration-300">
  <div id="root"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      const data = window.portfolioData;
      const [darkMode, setDarkMode] = useState(true);
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [activeSection, setActiveSection] = useState('home');
      const [publicationFilter, setPublicationFilter] = useState('All');
      const [pubSearchQuery, setPubSearchQuery] = useState('');
      const [patentFilter, setPatentFilter] = useState('All');
      const [fdpFilter, setFdpFilter] = useState('SWAYAM-NPTEL (IITs & IISc)');
      const [showCvModal, setShowCvModal] = useState(false);
      const [lightboxImg, setLightboxImg] = useState(null);
      const [contactStatus, setContactStatus] = useState(null);
      const [formData, setFormData] = useState({ name: '', email: '', subject: '', message: '' });

      // Synchronize dark mode class with html element
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Active section spy on scroll
      useEffect(() => {
        const handleScroll = () => {
          const sections = [
            'home', 'about', 'qualifications', 'experience', 'teaching',
            'research', 'projects', 'publications', 'patents', 'awards',
            'memberships', 'fdps', 'leadership', 'gallery', 'contact'
          ];
          const scrollPos = window.scrollY + 200;

          for (let i = sections.length - 1; i >= 0; i--) {
            const el = document.getElementById(sections[i]);
            if (el && el.offsetTop <= scrollPos) {
              setActiveSection(sections[i]);
              break;
            }
          }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Filtered Publications
      const filteredPublications = useMemo(() => {
        return data.publications.filter(pub => {
          const matchesCategory = 
            publicationFilter === 'All' ? true :
            publicationFilter === 'Journal' ? pub.type === 'Journal' :
            publicationFilter === 'Conference' ? pub.type === 'Conference' :
            publicationFilter === 'Book Chapter' ? pub.type === 'Book Chapter' : true;

          const query = pubSearchQuery.toLowerCase().trim();
          const matchesSearch = query === '' ||
            pub.title.toLowerCase().includes(query) ||
            pub.authors.toLowerCase().includes(query) ||
            pub.venue.toLowerCase().includes(query) ||
            (pub.indexing && pub.indexing.toLowerCase().includes(query)) ||
            pub.year.toString().includes(query);

          return matchesCategory && matchesSearch;
        });
      }, [publicationFilter, pubSearchQuery, data.publications]);

      // Filtered Patents & IP
      const filteredPatents = useMemo(() => {
        if (patentFilter === 'All') return data.patents;
        if (patentFilter === 'Granted') return data.patents.filter(p => p.type.includes('Granted'));
        if (patentFilter === 'Design') return data.patents.filter(p => p.type.includes('Design'));
        if (patentFilter === 'Published') return data.patents.filter(p => p.type.includes('Published'));
        if (patentFilter === 'Copyright') return data.patents.filter(p => p.type.includes('Copyright'));
        return data.patents;
      }, [patentFilter, data.patents]);

      const handleContactSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.email || !formData.message) {
          alert('Please fill out all required fields.');
          return;
        }
        setContactStatus('sending');
        setTimeout(() => {
          setContactStatus('success');
          // Formats a mailto fallback for direct sending
          const mailtoUri = `mailto:${data.profile.email}?subject=${encodeURIComponent(formData.subject || 'Academic Portfolio Inquiry')}&body=${encodeURIComponent(`Name: ${formData.name}\nEmail: ${formData.email}\n\nMessage:\n${formData.message}`)}`;
          window.location.href = mailtoUri;
          setFormData({ name: '', email: '', subject: '', message: '' });
          setTimeout(() => setContactStatus(null), 6000);
        }, 800);
      };

      const copyCitation = (pub) => {
        const citation = `${pub.authors} (${pub.year}). "${pub.title}." ${pub.venue}. ${pub.doi ? `DOI: ${pub.doi}` : ''}`;
        navigator.clipboard.writeText(citation).then(() => {
          alert('Citation copied to clipboard!');
        });
      };

      const navItems = [
        { id: 'about', label: 'About' },
        { id: 'experience', label: 'Experience' },
        { id: 'research', label: 'Research' },
        { id: 'projects', label: 'Projects' },
        { id: 'publications', label: 'Publications' },
        { id: 'patents', label: 'Patents' },
        { id: 'teaching', label: 'Teaching' },
        { id: 'awards', label: 'Awards' },
        { id: 'fdps', label: 'FDPs' },
        { id: 'contact', label: 'Contact' },
      ];

      return (
        <div className={`min-h-screen ${darkMode ? 'bg-[#060d1a] text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
          
          {/* ==================== NAVIGATION BAR ==================== */}
          <nav className={`fixed top-0 left-0 right-0 z-50 backdrop-blur-md transition-all duration-300 no-print ${
            darkMode ? 'bg-[#0a192f]/90 border-b border-slate-800/80' : 'bg-white/90 border-b border-slate-200'
          }`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                
                {/* Brand / Title */}
                <a href="#home" className="flex items-center space-x-3 group">
                  <div className="w-11 h-11 rounded-full overflow-hidden border-2 border-gold-500 shadow-md flex-shrink-0">
                    <img src={data.profile.photoUrl} alt={data.profile.name} className="w-full h-full object-cover object-top" />
                  </div>
                  <div>
                    <span className={`text-lg font-bold tracking-tight block ${darkMode ? 'text-white' : 'text-slate-900'} group-hover:text-gold-500 transition-colors`}>
                      Dr. Piyush Charan
                    </span>
                    <span className="text-xs text-gold-500 font-medium block">
                      Associate Professor • SMIEEE • FIETE • CEng
                    </span>
                  </div>
                </a>

                {/* Desktop Nav Links */}
                <div className="hidden xl:flex items-center space-x-1">
                  {navItems.map(item => (
                    <a
                      key={item.id}
                      href={`#${item.id}`}
                      className={`px-3 py-2 rounded-md text-sm font-medium transition-all ${
                        activeSection === item.id
                          ? 'text-gold-400 bg-royal-700/20 font-semibold'
                          : darkMode
                            ? 'text-slate-300 hover:text-white hover:bg-slate-800/50'
                            : 'text-slate-600 hover:text-royal-600 hover:bg-slate-100'
                      }`}
                    >
                      {item.label}
                    </a>
                  ))}
                </div>

                {/* Right Action Icons & Buttons */}
                <div className="hidden md:flex items-center space-x-3">
                  
                  {/* Theme Toggle */}
                  <button
                    onClick={() => setDarkMode(!darkMode)}
                    title={darkMode ? "Switch to Light Mode" : "Switch to Dark Mode"}
                    className={`p-2 rounded-lg border transition-colors ${
                      darkMode ? 'border-slate-700 text-gold-400 hover:bg-slate-800' : 'border-slate-300 text-slate-700 hover:bg-slate-100'
                    }`}
                  >
                    {darkMode ? (
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                      </svg>
                    ) : (
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                      </svg>
                    )}
                  </button>

                  {/* Download CV Modal Trigger */}
                  <button
                    onClick={() => setShowCvModal(true)}
                    className="flex items-center space-x-1.5 px-4 py-2 text-xs font-semibold rounded-lg bg-gradient-to-r from-royal-600 to-royal-700 hover:from-royal-500 hover:to-royal-600 text-white shadow-md transition-all hover:scale-105"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span>Download CV</span>
                  </button>

                  {/* Get in Touch Quick CTA */}
                  <a
                    href="#contact"
                    className="px-4 py-2 text-xs font-semibold rounded-lg border border-gold-500/80 text-gold-400 hover:bg-gold-500 hover:text-navy-950 transition-all"
                  >
                    Contact
                  </a>
                </div>

                {/* Mobile Hamburger Button */}
                <div className="flex items-center space-x-2 xl:hidden">
                  <button
                    onClick={() => setDarkMode(!darkMode)}
                    className="p-2 rounded-md border border-slate-700 text-gold-400"
                  >
                    {darkMode ? "☀" : "🌙"}
                  </button>
                  <button
                    onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                    className="p-2 rounded-md text-slate-300 hover:text-white focus:outline-none"
                  >
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      {isMobileMenuOpen ? (
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                      ) : (
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                      )}
                    </svg>
                  </button>
                </div>

              </div>
            </div>

            {/* Mobile Dropdown Menu */}
            {isMobileMenuOpen && (
              <div className={`xl:hidden px-4 pt-2 pb-6 space-y-2 border-b ${
                darkMode ? 'bg-navy-900 border-slate-800' : 'bg-white border-slate-200'
              }`}>
                {navItems.map(item => (
                  <a
                    key={item.id}
                    href={`#${item.id}`}
                    onClick={() => setIsMobileMenuOpen(false)}
                    className="block px-3 py-2 rounded-md text-sm font-medium hover:bg-royal-600/10 hover:text-gold-400"
                  >
                    {item.label}
                  </a>
                ))}
                <div className="pt-3 flex space-x-2">
                  <button
                    onClick={() => { setShowCvModal(true); setIsMobileMenuOpen(false); }}
                    className="flex-1 py-2 text-xs font-semibold text-center rounded-lg bg-royal-600 text-white"
                  >
                    Download CV
                  </button>
                  <a
                    href="#contact"
                    onClick={() => setIsMobileMenuOpen(false)}
                    className="flex-1 py-2 text-xs font-semibold text-center rounded-lg border border-gold-500 text-gold-400"
                  >
                    Contact
                  </a>
                </div>
              </div>
            )}
          </nav>

          {/* ==================== HERO SECTION ==================== */}
          <section id="home" className="relative pt-32 pb-20 md:pt-40 md:pb-28 overflow-hidden">
            {/* Subtle Gradient Backdrops */}
            <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[700px] bg-gradient-to-tr from-royal-600/15 via-gold-500/10 to-transparent rounded-full blur-3xl pointer-events-none"></div>

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                
                {/* Left Profile Info */}
                <div className="lg:col-span-7 space-y-6 text-center lg:text-left">
                  
                  {/* Institutional Badge */}
                  <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full text-xs font-semibold tracking-wide border border-gold-500/40 bg-gold-500/10 text-gold-400">
                    <span className="w-2 h-2 rounded-full bg-gold-400 animate-ping"></span>
                    <span>Manav Rachna University, Faridabad</span>
                    <span className="text-slate-400">|</span>
                    <span className="text-slate-300">Dept. of Robotics & AI / ECE</span>
                  </div>

                  <h1 className="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight">
                    <span className={darkMode ? 'text-white' : 'text-slate-900'}>Dr. Piyush </span>
                    <span className="bg-gradient-to-r from-gold-400 via-amber-300 to-gold-500 bg-clip-text text-transparent">
                      Charan
                    </span>
                  </h1>

                  <p className="text-lg sm:text-xl font-medium text-royal-400">
                    Ph.D. • Chartered Engineer [India] • FIETE • SMIEEE • LMISTE • LMIEI
                  </p>

                  <p className={`text-base sm:text-lg leading-relaxed max-w-2xl ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}>
                    {data.profile.tagline}. Associate Professor with over 14 years of research and teaching excellence, leading academic structuring in Robotics & AI, wireless sensor protocols, and data-driven intelligent systems.
                  </p>

                  {/* Verified Credential Badges Row */}
                  <div className="flex flex-wrap items-center justify-center lg:justify-start gap-2 pt-2">
                    <span className="px-3 py-1 text-xs rounded-md bg-navy-850 border border-royal-500/30 text-royal-300 font-mono">
                      IEEE Senior Member (#92668459)
                    </span>
                    <span className="px-3 py-1 text-xs rounded-md bg-navy-850 border border-royal-500/30 text-royal-300 font-mono">
                      IETE Fellow (#F-506999)
                    </span>
                    <span className="px-3 py-1 text-xs rounded-md bg-navy-850 border border-royal-500/30 text-royal-300 font-mono">
                      Chartered Engineer (IEI)
                    </span>
                    <span className="px-3 py-1 text-xs rounded-md bg-navy-850 border border-royal-500/30 text-royal-300 font-mono">
                      Google Certified Educator (L1 & L2)
                    </span>
                  </div>

                  {/* CTA Buttons */}
                  <div className="flex flex-wrap items-center justify-center lg:justify-start gap-4 pt-4">
                    <button
                      onClick={() => setShowCvModal(true)}
                      className="px-6 py-3 rounded-xl font-semibold text-sm bg-gradient-to-r from-royal-600 via-blue-600 to-royal-700 hover:from-royal-500 hover:to-royal-600 text-white shadow-royal-glow transition-all transform hover:-translate-y-0.5 flex items-center space-x-2"
                    >
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                      </svg>
                      <span>Download Full Academic CV</span>
                    </button>

                    <a
                      href="#publications"
                      className="px-6 py-3 rounded-xl font-semibold text-sm border border-slate-700 hover:border-gold-500 text-slate-300 hover:text-gold-400 bg-navy-900/60 transition-all flex items-center space-x-2"
                    >
                      <span>Explore Publications</span>
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                      </svg>
                    </a>

                    <a
                      href="#contact"
                      className="px-5 py-3 rounded-xl font-semibold text-sm border border-gold-500/40 text-gold-400 hover:bg-gold-500 hover:text-navy-950 transition-all"
                    >
                      Research Collaboration
                    </a>
                  </div>

                  {/* Direct Social & Academic Links */}
                  <div className="flex items-center justify-center lg:justify-start space-x-4 pt-4 text-slate-400">
                    <span className="text-xs uppercase tracking-wider font-semibold text-slate-500">Profiles:</span>
                    <a href={data.profile.socialLinks.linkedin} target="_blank" rel="noopener noreferrer" className="hover:text-blue-400 transition-colors" title="LinkedIn">
                      <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                    </a>
                    <a href={data.profile.socialLinks.googleScholar} target="_blank" rel="noopener noreferrer" className="hover:text-royal-400 transition-colors" title="Google Scholar">
                      <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 24a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm0-24L0 9.5l4.838 3.94A8 8 0 0 1 12 9a8 8 0 0 1 7.162 4.44L24 9.5z"/></svg>
                    </a>
                    <a href={data.profile.socialLinks.scopus} target="_blank" rel="noopener noreferrer" className="hover:text-amber-400 transition-colors text-xs font-bold border border-current px-1.5 py-0.5 rounded" title="Scopus">
                      SCOPUS
                    </a>
                    <a href={data.profile.socialLinks.vidwan} target="_blank" rel="noopener noreferrer" className="hover:text-emerald-400 transition-colors text-xs font-bold border border-current px-1.5 py-0.5 rounded" title="Vidwan">
                      VIDWAN
                    </a>
                    <a href={data.profile.socialLinks.slideshare} target="_blank" rel="noopener noreferrer" className="hover:text-indigo-400 transition-colors text-xs font-bold border border-current px-1.5 py-0.5 rounded" title="SlideShare">
                      SlideShare
                    </a>
                  </div>

                </div>

                {/* Right Portrait & Floating Credentials Card */}
                <div className="lg:col-span-5 flex justify-center relative">
                  <div className="relative">
                    
                    {/* Glowing gold border ring */}
                    <div className="absolute -inset-1.5 bg-gradient-to-r from-gold-500 via-royal-500 to-amber-500 rounded-3xl blur-md opacity-60 gold-pulse"></div>

                    {/* Main Portrait Frame */}

                      <img
                        src={data.profile.photoUrl}

                        <p className="text-white font-bold text-base">Dr. Piyush Charan</p>
                        <p className="text-xs text-gold-400 font-medium">Associate Professor & Chartered Engineer</p>
                      </div>
                    </div>

                    {/* Floating Achievement Mini Badge 1 */}
                    <div className="absolute -top-4 -left-6 bg-navy-900/90 backdrop-blur-md border border-royal-500/40 rounded-xl p-3 shadow-lg flex items-center space-x-2 hidden sm:flex">
                      <div className="w-8 h-8 rounded-lg bg-royal-600/30 flex items-center justify-center text-royal-400 font-bold text-sm">
                        14+

                      <div className="text-left">
